<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>共读成员 · 小书桌</title>
<style>
  :root{
    --bg:#f6f3ee; --fg:#2b2722; --dim:#8a8175; --line:#e2dbd0;
    --card:#fffdfa; --accent:#7a6cc4; --ok:#3f8f5f; --warn:#b4552d; --danger:#b23b3b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;padding:16px;background:var(--bg);color:var(--fg);
       font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:560px;margin:0 auto}
  h1{font-size:19px;margin:4px 0 2px;font-weight:600}
  .sub{color:var(--dim);font-size:13px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:14px;margin-bottom:14px}
  .card h2{font-size:14px;margin:0 0 10px;font-weight:600;color:var(--dim);letter-spacing:.04em}
  label{display:block;font-size:13px;color:var(--dim);margin:8px 0 4px}
  input,select{width:100%;padding:11px 12px;font-size:16px;border:1px solid var(--line);
        border-radius:10px;background:#fff;color:var(--fg);font-family:inherit}
  input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
  button{padding:11px 16px;font-size:15px;font-family:inherit;border-radius:10px;
         border:1px solid var(--line);background:#fff;color:var(--fg);cursor:pointer}
  button:active{transform:translateY(1px)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.danger{color:var(--danger);border-color:#eccfcf}
  button:disabled{opacity:.45;cursor:default}
  .row{display:flex;gap:8px;align-items:center}
  .row > *{flex:1}
  .row > button{flex:0 0 auto}
  ul{list-style:none;margin:0;padding:0}
  li{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
  li:last-child{border-bottom:0}
  .member{flex-wrap:wrap;align-items:flex-start}
  .member-main{flex:1 1 170px;min-width:0;overflow-wrap:anywhere}
  .member-actions{display:flex;gap:8px;flex-wrap:wrap}
  .rename-form{flex:1 0 100%;min-width:0}
  .rename-form[hidden]{display:none}
  .name{flex:1;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px}
  .msg{font-size:13px;padding:9px 11px;border-radius:9px;margin-top:10px;display:none}
  .msg.show{display:block}
  .msg.ok{background:#eaf5ee;color:var(--ok)}
  .msg.err{background:#fbeaea;color:var(--danger)}
  .msg.warn{background:#fdf0e6;color:var(--warn)}
  .tok{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;
       word-break:break-all;background:#f2efe9;border:1px dashed var(--line);
       border-radius:10px;padding:11px;margin-top:8px;user-select:all;-webkit-user-select:all}
  .hint{color:var(--dim);font-size:12.5px;margin-top:6px}
  .big{font-size:16px;font-weight:600;color:var(--warn)}
  .empty{color:var(--dim);font-size:13.5px;padding:6px 0}
</style>
</head>
<body><div class="wrap">
<h1>共读成员</h1><div class="sub">添加人类读者或 Agent，每位成员拥有独立的阅读身份。</div>
<div class="card" id="setupCard" hidden><h2>首次设置</h2>
<label for="setupCode">一次性初始化码</label><input id="setupCode" type="password" autocomplete="off">
<label for="setupPw">管理员口令（至少 8 位）</label><input id="setupPw" type="password" autocomplete="new-password">
<label for="setupPw2">再输一次</label><input id="setupPw2" type="password" autocomplete="new-password">
<button id="setupBtn" class="primary">设置口令</button></div>
<div class="card"><label for="adminPw">管理员口令</label><input id="adminPw" type="password" autocomplete="current-password">
<div class="hint">用于查看成员、修改显示名、添加成员和撤销凭据。刷新页面后需重新输入。</div>
<button id="refreshBtn">查看 / 刷新成员</button><div id="statusMsg" class="msg" role="status"></div></div>
<div class="card"><h2>现有成员</h2><ul id="list"><li class="empty">输入管理员口令后查看</li></ul>
<div class="hint">显示名可以重复，修改后原凭证继续有效，稳定 ID 和历史记录归属保持不变。user 也可修改显示名，但不能撤销凭据。</div></div>
<div class="card"><h2>添加共读成员</h2>
<label for="kind">成员类型</label><select id="kind"><option value="human">人类读者</option><option value="agent">Agent</option></select>
<label for="nickname">昵称</label><input id="nickname" maxlength="64" placeholder="填写便于识别的名字" autocomplete="off">
<div id="agentOptions" hidden><label for="channel">客户端接入方式</label><select id="channel"><option value="mcp">URL + Bearer 令牌</option><option value="mcp-url">仅 URL（GPT 等客户端）</option></select></div>
<div class="hint">系统生成稳定 ID。成员类型不会授予管理员权限。</div>
<button id="createBtn" class="primary">添加成员并生成凭据</button><div id="createMsg" class="msg" role="status"></div>
<div id="tokenBox" hidden><div class="big">凭据仅显示这一次，请私下保存</div>
<div id="createdMember" class="hint"></div><label id="urlLabel">接入地址</label><div class="tok" id="urlVal"></div><button id="copyUrlBtn">复制地址</button>
<div id="tokenDetail"><label>访问令牌</label><div class="tok" id="tokenVal"></div><button id="copyTokenBtn">复制令牌</button></div>
<div id="instructions" class="hint"></div><button id="dismissBtn">我已保存，隐藏凭据</button></div></div>
</div><script>
const $ = id => document.getElementById(id);
function msg(id, text, ok=false){ $(id).className='msg show '+(ok?'ok':'err'); $(id).textContent=text; }
async function api(path,body){
  const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),cache:'no-store'});
  const d=await r.json(); if(!r.ok || !d.ok) throw new Error(d.error || '请求失败'); return d;
}
function pw(){ const password=$('adminPw').value; if(!password)throw new Error('请先输入管理员口令'); return password; }
function clearSecret(){ $('tokenBox').hidden=true; ['urlVal','tokenVal','createdMember','instructions'].forEach(id=>$(id).textContent=''); }
$('dismissBtn').onclick=clearSecret;
window.addEventListener('pagehide',()=>{clearSecret();$('adminPw').value='';});
$('kind').onchange=()=>{ $('agentOptions').hidden=$('kind').value!=='agent'; };
const kinds={human:'人类读者',agent:'Agent',legacy:'历史成员（类型未确认）'};
const channels={web:'网页',mcp:'MCP / Bearer','mcp-url':'MCP / 仅 URL',legacy:'原有凭据'};
async function refresh(){
  const d=await api('/api/members/list',{password:pw()}); const ul=$('list'); ul.replaceChildren();
  for(const m of d.members){
    const li=document.createElement('li'), box=document.createElement('div');li.className='member';li.dataset.memberId=m.id;box.className='member-main';
    const title=document.createElement('strong');title.textContent=m.nickname;
    const detail=document.createElement('div');detail.className='hint';
    detail.textContent=m.id+' · '+kinds[m.kind]+' · '+channels[m.credential.channel]+' · '+(m.credential.status==='active'?'有效':'已撤销');
    const actions=document.createElement('div');actions.className='member-actions';
    const rename=document.createElement('button');rename.type='button';rename.textContent='修改显示名';actions.append(rename);
    const form=document.createElement('form');form.className='rename-form';form.hidden=true;
    const label=document.createElement('label');label.textContent='新显示名';label.htmlFor='rename-'+m.id;
    const input=document.createElement('input');input.id=label.htmlFor;input.maxLength=64;input.required=true;input.autocomplete='off';
    const buttons=document.createElement('div');buttons.className='member-actions';
    const save=document.createElement('button');save.type='submit';save.className='primary';save.textContent='保存显示名';
    const cancel=document.createElement('button');cancel.type='button';cancel.textContent='取消';buttons.append(save,cancel);
    const error=document.createElement('div');error.className='msg';error.setAttribute('role','status');
    form.append(label,input,buttons,error);box.append(title,detail);li.append(box,actions,form);
    const close=()=>{form.hidden=true;rename.disabled=false;rename.focus();};
    rename.onclick=()=>{input.value=m.nickname;error.className='msg';form.hidden=false;rename.disabled=true;input.focus();input.select();};
    cancel.onclick=close;
    form.onkeydown=e=>{if(e.key==='Escape' && !save.disabled){e.preventDefault();close();}};
    form.onsubmit=async e=>{
      e.preventDefault();if(save.disabled)return;
      const controls=[...li.querySelectorAll('button,input')];controls.forEach(el=>el.disabled=true);
      try{
        const d=await api('/api/members/rename',{password:pw(),member_id:m.id,nickname:input.value,expected_nickname:m.nickname});
        m.nickname=d.member.nickname;title.textContent=m.nickname;form.hidden=true;
        msg('statusMsg','显示名已更新，原凭证继续有效。阅读器刷新后会显示新名字。',true);
      }catch(e){error.textContent=e.message;error.className='msg show err';}
      finally{controls.forEach(el=>el.disabled=false);rename.disabled=!form.hidden;if(form.hidden)rename.focus();}
    };
    if(m.id!=='user' && m.credential.status==='active'){
      const b=document.createElement('button'); b.textContent='撤销凭据';b.className='danger';
      b.onclick=async()=>{
        if(!confirm('撤销「'+m.nickname+'」（'+m.id+'）的此项凭据？后续请求会被拒绝，历史记录保留。'))return;
        b.disabled=true;
        try{await api('/api/credentials/revoke',{password:pw(),member_id:m.id,credential_id:m.credential.id});clearSecret();await refresh();msg('statusMsg','凭据已撤销，历史记录保留。',true);}
        catch(e){msg('statusMsg',e.message);}finally{b.disabled=false;}
      };actions.append(b);
    }ul.append(li);
  }
  msg('statusMsg','共 '+d.members.length+' 位成员，列表不返回令牌。',true);
}
$('refreshBtn').onclick=()=>refresh().catch(e=>{ $('list').replaceChildren();msg('statusMsg',e.message); });
$('createBtn').onclick=async()=>{
  const button=$('createBtn');button.disabled=true;clearSecret();
  try{
    const kind=$('kind').value,channel=kind==='human'?'web':$('channel').value;
    const d=await api('/api/members',{password:pw(),kind,channel,nickname:$('nickname').value.trim()});
    $('createdMember').textContent=d.member.nickname+' · '+d.member.id;
    $('urlVal').textContent=d.url;$('tokenVal').textContent=channel==='mcp-url'?'':d.token;
    $('tokenDetail').hidden=channel==='mcp-url';$('instructions').textContent=d.instructions;
    $('tokenBox').hidden=false;msg('createMsg','成员已创建，请保存下方接入信息。',true);
    try{await refresh();}catch(e){msg('statusMsg','成员已创建；列表刷新失败，请保存凭据后重试。');}
  }catch(e){msg('createMsg',e.message);}finally{button.disabled=false;}
};
async function copy(id){
  try{await navigator.clipboard.writeText($(id).textContent);}
  catch(e){const r=document.createRange();r.selectNodeContents($(id));const s=getSelection();s.removeAllRanges();s.addRange(r);}
}
$('copyUrlBtn').onclick=()=>copy('urlVal');$('copyTokenBtn').onclick=()=>copy('tokenVal');
$('setupBtn').onclick=async()=>{
  try{if($('setupPw').value!==$('setupPw2').value)throw new Error('两次口令不一致');
    await api('/api/setup',{password:$('setupPw').value,bootstrap:$('setupCode').value.trim()});
    $('setupCode').value=$('setupPw').value=$('setupPw2').value='';$('setupCard').hidden=true;msg('statusMsg','口令已设置。',true);
  }catch(e){msg('statusMsg',e.message);}
};
fetch('/api/status',{cache:'no-store'}).then(r=>r.json()).then(d=>{
  $('setupCard').hidden=d.configured;
  if(d.admin_error||d.store_error)msg('statusMsg','服务配置或身份文件不可用，请核对可信备份。');
}).catch(()=>msg('statusMsg','暂时无法连接服务，请稍后刷新。'));
</script></body></html>
